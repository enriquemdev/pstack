name: pstack port checks
on:
  push:
    branches: [main]
    paths: ['ports/pstack/**', 'pstack/**', '.github/workflows/pstack-port.yml']
  pull_request:
    paths: ['ports/pstack/**', 'pstack/**', '.github/workflows/pstack-port.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate pinned source, packaging, permissions and reversible setup
        run: python3 -m unittest discover -s ports/pstack/tests -v
      - name: Validate both bundles
        run: |
          python3 ports/pstack/pstack.py validate ports/pstack/dist/codex
          python3 ports/pstack/pstack.py validate ports/pstack/dist/antigravity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pstack-port-${{ matrix.os }}
          path: ports/pstack/dist/
          retention-days: 14
