name: pstack upstream review
on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pstack-upstream-review
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'enriquemdev/pstack'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare draft only when pstack changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ports/pstack/check_upstream.py --prepare-pr
