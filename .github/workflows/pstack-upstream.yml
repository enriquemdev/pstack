name: pstack upstream review
on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pstack-upstream-review
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'enriquemdev/pstack'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Prepare draft only when pstack changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ports/pstack/check_upstream.py --prepare-pr
